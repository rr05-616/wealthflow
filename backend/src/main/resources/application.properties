spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wealthflow;DB_CLOSE_DELAY=-1}
server.port=${SERVER_PORT:8081}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=wealthflow-workflow
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.wealthflow
spring.kafka.consumer.properties.spring.json.value.default.type=com.wealthflow.ChargebackEvent
wealthflow.topic=soa.s08.t24.events

wealthflow.jwt.secret=local-demo-jwt-secret-32-bytes-minimum

